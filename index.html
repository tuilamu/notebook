<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notebook · Việc & Thói quen</title>
<style>
:root{
  --bg:#f6f7fb;--panel:#fff;--panel2:#f0f2f8;--text:#1c2233;--muted:#6b7490;--border:#e2e5f0;
  --accent:#5b6cff;--accent-soft:#e8ebff;--done:#22b573;--frozen:#3aa6ff;--fail:#ef5b5b;--warn:#ff8a3d;
  --shadow:0 4px 20px rgba(30,40,90,.08);--radius:14px;
}
:root[data-theme="dark"]{
  --bg:#0f1220;--panel:#171b2e;--panel2:#1f2440;--text:#e9ecf8;--muted:#8d95b5;--border:#2a3052;
  --accent:#7c89ff;--accent-soft:#252b55;--shadow:0 4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:8px 12px;min-height:38px}
button:hover{background:var(--panel2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--fail)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--panel2)}
button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=text],input[type=search],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 12px;min-height:38px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

#app{display:grid;grid-template-columns:290px 1fr;height:100%}
#sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;z-index:30}
.sb-head{padding:16px 16px 8px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
#tree{flex:1;overflow:auto;padding:4px 8px}
.sb-foot{padding:10px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-foot .wide{grid-column:1/-1}
.tnode{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;cursor:pointer;user-select:none}
.tnode:hover{background:var(--panel2)}
.tnode.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tnode .chev{width:20px;text-align:center;color:var(--muted);flex:none}
.tnode .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#overlay{display:none}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;gap:8px;align-items:center;padding:12px 16px 8px}
.topbar #btnMenu{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 16px 10px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--border);font-weight:600;font-size:14px}
.chip.btn{cursor:pointer}
.chip.btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.spacer{flex:1}
#content{flex:1;overflow:auto;padding:0 16px 90px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0 10px;color:var(--muted)}
.crumbs button{padding:4px 8px;min-height:30px;border:none;background:transparent;color:var(--accent);font-weight:600}
.crumbs button:hover{background:var(--accent-soft)}
.crumbs .cur{font-weight:700;color:var(--text)}
h2{margin:0 0 8px;font-size:20px}
.bar{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--done));border-radius:999px;transition:width .3s}
.bar-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:6px}

.list{padding:6px}
.row{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:10px;position:relative}
.row:hover{background:var(--panel2)}
.row .chev{width:22px;text-align:center;color:var(--muted);cursor:pointer;flex:none;user-select:none}
.row .ico{flex:none}
.row .title{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.row.task .title{cursor:default}
.row.isdone .title{text-decoration:line-through;color:var(--muted)}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--done);flex:none;cursor:pointer}
.badge{font-size:12px;color:var(--muted);background:var(--panel2);padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.daily{color:var(--accent);background:var(--accent-soft)}
.row .more{padding:2px 8px;min-height:30px;border:none;background:transparent;color:var(--muted);font-size:18px}
.row.dragging{opacity:.4}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:3px;background:var(--accent);border-radius:3px}
.row.drop-before::before{top:-2px}.row.drop-after::after{bottom:-2px}
.row.drop-into{outline:2px dashed var(--accent);outline-offset:-2px}
.row.flash{animation:flash 1.4s}
@keyframes flash{0%,60%{background:var(--accent-soft)}100%{background:transparent}}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.addbar input{flex:1;min-width:160px}

.streak-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.streak-hero .big{font-size:34px;font-weight:800;line-height:1.1}
.streak-hero .lbl{color:var(--muted);font-size:13px}
.ice{letter-spacing:2px;font-size:22px}.ice .off{opacity:.25;filter:grayscale(1)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;color:var(--muted);font-size:12px}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--panel2);font-size:13px;color:var(--muted)}
.cal .d.done{background:var(--done);color:#fff}
.cal .d.frozen{background:var(--frozen);color:#fff}
.cal .d.failed{background:var(--fail);color:#fff}
.cal .d.pending{background:transparent;border:2px dashed var(--warn);color:var(--text)}
.cal .d.today{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.dailyitem{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border)}
.dailyitem:last-child{border:none}
.dailyitem .path{color:var(--muted);font-size:12px}
.dailyitem input{width:20px;height:20px;accent-color:var(--done)}
.dailyitem.isdone .t{text-decoration:line-through;color:var(--muted)}

#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,30,.5);z-index:100;padding:16px}
#modal.on{display:flex}
.dlg{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:420px;max-height:85vh;overflow:auto;padding:16px;border:1px solid var(--border)}
.dlg h3{margin:0 0 12px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.menu-btn{display:block;width:100%;text-align:left;margin-bottom:6px}
.pick{padding:9px 10px;border-radius:8px;cursor:pointer}
.pick:hover{background:var(--panel2)}
.pick.dis{opacity:.35;pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;max-width:90vw}
#toast.on{opacity:1}


.dt3{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.dlg label{display:block;font-size:13px;color:var(--muted)}
.dlg label>input,.dlg label>select{margin-top:4px}
.dlg label.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--text)}
.dlg label.chk input{width:18px;height:18px;margin:0}
.dlg textarea{display:block;width:100%;margin:8px 0;resize:vertical}
.dlg select{margin:6px 0}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qchips button{padding:4px 10px;min-height:30px;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:10px 0}
.pstat{background:var(--panel2);border-radius:10px;padding:8px 10px}
.pstat .v{font-weight:800;font-size:17px}
.pstat .l{font-size:12px;color:var(--muted)}
.prow{margin-top:10px}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.banner{background:rgba(239,91,91,.12);color:var(--fail);border-radius:10px;padding:8px 12px;margin-top:10px;font-weight:600;cursor:pointer}
.item-card{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.item-card:hover{background:var(--panel2)}
.ic-t{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.ic-t{flex-wrap:wrap}
.ic-t .nm{flex:1 1 110px;min-width:0;overflow-wrap:anywhere}
.item-card .bar-meta{gap:4px 10px;flex-wrap:wrap}
.cal.click .d{cursor:pointer}
.cal .d.upcoming{background:var(--accent-soft);color:var(--accent)}
.cal .d.inwin{border:1px solid var(--accent-soft)}
.cal .d.sel{box-shadow:0 0 0 3px var(--accent)}
.dayhead{font-size:12px;font-weight:700;color:var(--muted);padding:10px 8px 2px;text-transform:uppercase;letter-spacing:.3px}
.row.ptask{align-items:flex-start}
.row.ptask input[type=checkbox]{margin-top:2px}
.row.ptask .body{flex:1;min-width:0}
.pt-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.badge.over{background:var(--fail);color:#fff}
.badge.today{background:var(--warn);color:#fff}
.badge.ok{background:rgba(34,181,115,.15);color:var(--done)}
.badge.up{background:var(--accent-soft);color:var(--accent)}
.row.overdue{background:rgba(239,91,91,.08)}
.mini{padding:2px 10px;min-height:28px;font-size:12px}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed;inset:0 auto 0 0;width:300px;max-width:86vw;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
  #sidebar.open{transform:none}
  #overlay.on{display:block;position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:25}
  .topbar #btnMenu{display:inline-block}
  .streak-hero .big{font-size:28px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">📓 Notebook</div>
    <div id="tree"></div>
    <div class="sb-foot">
      <button class="primary wide" id="btnAddRoot">＋ Thư mục gốc</button>
      <button id="btnExport">⬇ Xuất JSON</button>
      <button id="btnImport">⬆ Nhập JSON</button>
    </div>
  </aside>
  <div id="overlay"></div>
  <main>
    <header class="topbar">
      <button id="btnMenu" class="ghost" aria-label="Mở menu">☰</button>
      <input id="search" type="search" placeholder="🔍 Tìm công việc, thư mục…">
      <button id="btnMode" title="Bật/tắt chế độ hoàn thành">☑</button>
      <button id="btnTheme" title="Sáng/Tối">🌓</button>
    </header>
    <div class="chips" id="chips"></div>
    <section id="content"></section>
  </main>
</div>
<div id="modal"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<div id="toast"></div>

<script>
/*LOGIC_START*/
const TZ = 'Asia/Ho_Chi_Minh';
const MAX_FREEZE = 3;
const MAX_PLAN_DAYS = 3650;
const DateUtil = {
  today(now) {
    return new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'}).format(now || new Date());
  },
  add(s, n) {
    const p = s.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  },
  diff(a, b) {
    const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
    return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5);
  },
  valid(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && DateUtil.add(s, 0) === s; }
};
const Streak = {
  /* required: {date:[ids]} = tập việc bắt buộc của từng ngày (ảnh chụp, ngày đã qua không bị ghi đè).
     Điền các ngày bị bỏ qua (app không mở): phần hằng ngày lấy theo ngày gần nhất,
     phần kế hoạch lấy theo lịch đến hạn (opts.dueOn). Idempotent. */
  syncRequired(required, currentIds, today, opts) {
    const keys = Object.keys(required).filter(k => k < today).sort();
    if (keys.length) {
      const last = keys[keys.length - 1];
      for (let d = DateUtil.add(last, 1); d < today; d = DateUtil.add(d, 1)) {
        if (!required[d]) {
          let base = required[last].slice();
          if (opts) base = base.filter(id => !opts.isPlan(id)).concat(opts.dueOn(d));
          required[d] = base;
        }
      }
    }
    required[today] = currentIds.slice();
    return required;
  },
  /* Tính lại toàn bộ chuỗi từ lịch sử (thuần hàm) → không bao giờ tính trùng khi tải lại trang.
     doneOn[id] = ngày hoàn thành của việc kế hoạch; xong trước hoặc đúng hạn mới tính cho ngày đó. */
  compute(required, log, today, doneOn) {
    const res = {current: 0, best: 0, freezes: MAX_FREEZE, days: {}};
    const keys = Object.keys(required).filter(k => k <= today).sort();
    if (!keys.length) return res;
    let cur = 0, best = 0, fr = MAX_FREEZE, prevSt = '';
    for (let d = keys[0]; d <= today; d = DateUtil.add(d, 1)) {
      const ids = required[d] || [];
      if (!ids.length) { res.days[d] = 'none'; continue; }
      const l = log[d] || {};
      const done = ids.every(id => l[id] || (doneOn && doneOn[id] && doneOn[id] <= d));
      if (done) {
        cur++; if (cur > best) best = cur;
        /* Chỉ hồi 1 lượt đóng băng khi hôm trước chuỗi đang được giữ bằng một ngày hoàn thành thật sự.
           Ngày hoàn thành ngay sau ngày đóng băng (hoặc sau khi chuỗi đứt) chỉ nối chuỗi, không hồi lượt. */
        if (prevSt === 'done') fr = Math.min(MAX_FREEZE, fr + 1);
        res.days[d] = 'done';
      } else if (d === today) {
        res.days[d] = 'pending';
      } else if (fr > 0) {
        fr--; res.days[d] = 'frozen';
      } else {
        cur = 0; res.days[d] = 'failed';
      }
      prevSt = res.days[d];
    }
    res.current = cur; res.best = best; res.freezes = fr;
    return res;
  }
};
/* Engine: dữ liệu + quy tắc của Notebook, kế hoạch dài hạn và liên kết Streak (thuần hàm trên S, kiểm thử được bằng Node). */
const Engine = {
  kids(S, pid) { return Object.values(S.nodes).filter(n => n.parentId === pid).sort((a, b) => a.order - b.order); },
  tEnd(n) { return DateUtil.add(n.sched.start, n.sched.days - 1); },
  hasSched(n) { return n.type === 'task' && !!n.sched && !n.daily; },
  isPlanTask(S, n) { const p = n.parentId && S.nodes[n.parentId]; return Engine.hasSched(n) && !!(p && p.plan); },
  planKids(S, fid) { return Engine.kids(S, fid).filter(k => k.type === 'folder' && k.plan); },
  planTasks(S, fid) {
    const out = [];
    const w = id => Engine.kids(S, id).forEach(k => { if (k.type === 'task') out.push(k); else if (k.plan) w(k.id); });
    w(fid); return out;
  },
  dailyIds(S) { return Object.values(S.nodes).filter(n => n.type === 'task' && n.daily).map(n => n.id); },
  /* việc kế hoạch ĐẾN HẠN vào ngày d (hạn chót = ngày kết thúc của việc) */
  dueIds(S, d) { return Object.values(S.nodes).filter(n => Engine.isPlanTask(S, n) && Engine.tEnd(n) === d).map(n => n.id); },
  requiredNow(S, today) { return Engine.dailyIds(S).concat(Engine.dueIds(S, today)); },
  isDone(S, id, d) { return !!(S.log[d] && S.log[d][id]) || !!(S.doneOn[id] && S.doneOn[id] <= d); },
  /* Không cho bỏ tích việc đã xong đúng hạn của một ngày đã khép lại (tránh sửa lịch sử). */
  canUncheck(S, id, today) {
    const dn = S.doneOn[id]; if (!dn) return true;
    for (const d of Object.keys(S.required)) if (d < today && S.required[d].indexOf(id) >= 0 && dn <= d) return false;
    return true;
  },
  sync(S, today) {
    S.doneOn = S.doneOn || {};
    for (const n of Object.values(S.nodes)) if (Engine.hasSched(n) && n.done && !S.doneOn[n.id]) S.doneOn[n.id] = today;
    /* Việc ĐÃ xong của hôm nay luôn được giữ trong yêu cầu hôm nay, kể cả khi sau đó tắt chế độ
       kế hoạch/hằng ngày hoặc xóa việc → không mất công nhận ngày vừa hoàn thành. Bỏ tích thì tự rơi khỏi danh sách. */
    const cur = Engine.requiredNow(S, today);
    (S.required[today] || []).forEach(id => { if (cur.indexOf(id) < 0 && Engine.isDone(S, id, today)) cur.push(id); });
    Streak.syncRequired(S.required, cur, today, {
      isPlan: id => { const n = S.nodes[id]; return !!(n && Engine.hasSched(n)); },
      dueOn: d => Engine.dueIds(S, d)
    });
  },
  toggle(S, id, today) {
    const n = S.nodes[id]; if (!n || n.type !== 'task') return {ok: false, reason: 'none'};
    if (n.daily) {
      const l = S.log[today] = S.log[today] || {};
      if (l[id]) delete l[id]; else l[id] = true;
      if (!Object.keys(l).length) delete S.log[today];
      return {ok: true};
    }
    if (Engine.hasSched(n)) {
      if (!n.done) {
        if (Engine.isPlanTask(S, n) && n.sched.start > today) return {ok: false, reason: 'notStarted', start: n.sched.start};
        n.done = true; S.doneOn[id] = today; return {ok: true};
      }
      if (!Engine.canUncheck(S, id, today)) return {ok: false, reason: 'locked'};
      n.done = false; delete S.doneOn[id]; return {ok: true};
    }
    n.done = !n.done; return {ok: true};
  },
  state(S, n, today) {
    if (n.daily) return 'daily';
    if (!n.sched) return 'unscheduled';
    const e = Engine.tEnd(n);
    if (n.done) return (S.doneOn[n.id] && S.doneOn[n.id] > e) ? 'late' : 'done';
    if (e < today) return 'overdue';
    if (n.sched.start > today) return 'upcoming';
    return 'active';
  },
  /* Cửa sổ thời gian của một kế hoạch: hợp của (thời gian riêng nếu là mục lá) + các việc + các mục con.
     = từ ngày bắt đầu sớm nhất đến ngày kết thúc xa nhất, KHÔNG cộng dồn số ngày các mục song song. */
  window(S, fid) {
    const f = S.nodes[fid]; if (!f) return null;
    const subs = Engine.planKids(S, fid);
    let s = null, e = null;
    const ext = (a, b) => { if (!a) return; if (s === null || a < s) s = a; if (e === null || b > e) e = b; };
    if (!subs.length && f.sched) ext(f.sched.start, DateUtil.add(f.sched.start, f.sched.days - 1));
    for (const t of Engine.kids(S, fid)) if (t.type === 'task' && t.sched) ext(t.sched.start, Engine.tEnd(t));
    for (const c of subs) { const w = Engine.window(S, c.id); if (w) ext(w.start, w.end); }
    return s === null ? null : {start: s, end: e, days: DateUtil.diff(s, e) + 1};
  },

    const dn = Engine.isDone(S, n.id, today);
    const cb = h('input', {type: 'checkbox'}); cb.checked = dn; cb.addEventListener('change', () => toggleTask(n.id));
    const kind = n.daily ? '🔁 Hằng ngày' : '🗓 Kế hoạch';
    dl.append(h('div', {class: 'dailyitem' + (dn ? ' isdone' : '')}, cb, h('div', {}, h('div', {class: 't'}, n.title), h('div', {class: 'path'}, kind + ' · ' + (path(n.id).slice(0, -1).map(x => x.title).join(' / ') || 'Gốc')))));
  });
  if (ids.length) {
    const left = ids.filter(n => !Engine.isDone(S, n.id, today)).length;
    dl.append(h('div', {class: 'bar-meta'}, left ? `Còn ${left} việc để giữ chuỗi hôm nay` : '✅ Đã hoàn thành tất cả hôm nay!'));
  }
  box.append(dl);
  /* calendar */
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)), off = (first.getUTCDay() + 6) % 7, dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const shiftM = k => { const d = new Date(Date.UTC(y, m - 1 + k, 1)); calMonth = d.toISOString().slice(0, 7); renderStreak(); };
  const cal = h('div', {class: 'cal'});
  ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].forEach(x => cal.append(h('div', {class: 'dow'}, x)));
  for (let i = 0; i < off; i++) cal.append(h('div'));
  for (let d = 1; d <= dim; d++) {
    const ds = `${calMonth}-${String(d).padStart(2, '0')}`, st = r.days[ds];
    cal.append(h('div', {class: 'd' + (st && st !== 'none' ? ' ' + st : '') + (ds === today ? ' today' : ''), title: ds}, d));
  }
  box.append(h('div', {class: 'card'},
    h('div', {class: 'cal-head'}, h('button', {onclick: () => shiftM(-1)}, '◀'), h('b', {}, `Tháng ${m}/${y}`), h('button', {onclick: () => shiftM(1)}, '▶')),
    cal,
    h('div', {class: 'legend'},
      h('span', {}, h('i', {style: 'background:var(--done)'}), 'Hoàn thành'),
      h('span', {}, h('i', {style: 'background:var(--frozen)'}), 'Đóng băng'),
      h('span', {}, h('i', {style: 'background:var(--fail)'}), 'Thất bại'),
      h('span', {}, h('i', {style: 'border:2px dashed var(--warn)'}), 'Hôm nay (chưa xong)'))));
}

function render() {
  if (cur && !S.nodes[cur]) cur = null;
  applyTheme(); renderChips(); renderTree();
  if (view === 'streak') renderStreak(); else renderNotes();
}

/* ---------- Drawer, toolbar, backup ---------- */
function closeDrawer() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('on'); }
$('#btnMenu').onclick = () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('on'); };
$('#overlay').onclick = closeDrawer;
$('#btnTheme').onclick = () => { S.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; save(); render(); };
$('#btnMode').onclick = () => { S.settings.mode = !S.settings.mode; save(); render(); toast(S.settings.mode ? 'Đã bật chế độ hoàn thành' : 'Đã tắt chế độ hoàn thành (dữ liệu vẫn được giữ)'); };
$('#btnAddRoot').onclick = () => { closeDrawer(); addTo(null, 'folder'); };
$('#search').addEventListener('input', e => { query = e.target.value.trim(); view = 'notes'; renderChips(); renderNotes(); });
$('#btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
  const a = h('a', {href: URL.createObjectURL(blob), download: `notebook-backup-${today}.json`});
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Đã xuất file sao lưu');
};
$('#btnImport').onclick = () => $('#fileIn').click();
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!valid(o)) throw new Error('bad');
    if (!(await confirmBox('Nhập dữ liệu sẽ thay thế toàn bộ dữ liệu hiện tại. Tiếp tục?', 'Nhập'))) return;
    o.settings = o.settings || {mode: true, theme: null};
    o.doneOn = o.doneOn || {}; S = o; cur = null; commit(); closeDrawer(); toast('Đã nhập dữ liệu');
  } catch (err) { toast('File JSON không hợp lệ'); }
});

/* ---------- Day rollover ---------- */
function checkDay() {
  const t = DateUtil.today();
  if (t !== today) { today = t; calMonth = t.slice(0, 7); commit(); toast('Sang ngày mới ' + t.split('-').reverse().join('/')); }
}
setInterval(checkDay, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
window.addEventListener('focus', checkDay);

/* ---------- Init ---------- */
S = load(); sync(); save(); render();
window.__app = {Engine, get state() { return S; }, toggleTask, addNode, moveNode, removeNode, toggleDaily, compute: () => Streak.compute(S.required, S.log, today, S.doneOn)};
})();
</script>
</body>
